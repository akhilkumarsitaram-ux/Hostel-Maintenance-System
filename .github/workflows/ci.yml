name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Tests and Ruff
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: development
      SECRET_KEY: ci-test-secret-key-min-16-chars
      DATABASE_PATH: /tmp/ci_hostel_test.db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hostel-maintenance-system:ci .
