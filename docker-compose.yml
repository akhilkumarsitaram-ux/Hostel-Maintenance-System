services:
  web:
    build: .
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret-for-demo}
      DATABASE_PATH: /data/hostel_maintenance.db
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - hostel_db_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hostel_db_data:
